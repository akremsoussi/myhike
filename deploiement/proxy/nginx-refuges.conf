# Configuration Nginx pour vm-proxy (Ubuntu-Web)
# Emplacement : /etc/nginx/sites-available/default

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # 1. Renvoi des appels de l'API vers le serveur d'application (vm-metier)
    location /api/ {
        proxy_pass http://10.10.10.20:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Gestion des routes du Single Page Application (React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
