<ellipse cx="770" cy="1444" rx="350" ry="29" fill="white" stroke="#87652c" stroke-width="1.7" />
<text x="770" y="1450" text-anchor="middle" font-family="Arial" font-size="18" fill="#172e29">Créer, modifier ou supprimer des communautés</text>
<path d="M170,1406.0 L420,1520" fill="none" stroke="#87652c" stroke-width="1.5" opacity="0.68" />
<ellipse cx="770" cy="1520" rx="350" ry="29" fill="white" stroke="#87652c" stroke-width="1.7" />
<text x="770" y="1526" text-anchor="middle" font-family="Arial" font-size="18" fill="#172e29">Gérer les comptes utilisateurs classiques</text>
