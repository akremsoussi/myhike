<ellipse cx="770" cy="1655" rx="350" ry="29" fill="white" stroke="#74549a" stroke-width="1.7" />
<text x="770" y="1661" text-anchor="middle" font-family="Arial" font-size="18" fill="#172e29">Promouvoir ou rétrograder des modérateurs</text>
<path d="M170,1693.0 L420,1731" fill="none" stroke="#74549a" stroke-width="1.5" opacity="0.68" />
<ellipse cx="770" cy="1731" rx="350" ry="29" fill="white" stroke="#74549a" stroke-width="1.7" />
<text x="770" y="1737" text-anchor="middle" font-family="Arial" font-size="18" fill="#172e29">Gérer les comptes des modérateurs</text>
<circle cx="155" cy="1645.0" r="17" fill="white" stroke="#74549a" stroke-width="2.5" />
