<text x="155" y="1765.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#74549a">Super-administrateur</text>
<path d="M138,1363.0 H60 V910.0 H155 V897.0" fill="none" stroke="#526475" stroke-width="1.5" marker-end="url(#generalization)" />
<path d="M138,1650.0 H60 V1501.0 H155 V1488.0" fill="none" stroke="#526475" stroke-width="1.5" marker-end="url(#generalization)" />
<text x="35" y="1901" font-family="Arial" font-size="14" fill="#536960">Le modérateur hérite des droits utilisateur ; le super-administrateur hérite des droits du modérateur.</text>
<text x="35" y="1922" font-family="Arial" font-size="14" fill="#536960">Les fonctions utilisateur exigent un compte actif et confirmé. Conditions et statut sont publics.</text>
<text x="35" y="1943" font-family="Arial" font-size="14" fill="#536960">Les super-administrateurs sont protégés ; les auto-sanctions sont interdites. Certains objectifs sont regroupés.</text>
</svg>